name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Evaluate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Check formatting
        run: nix fmt -- --ci

      # resolves every module and option; not `nix flake check`, which builds
      - name: Evaluate system closure
        run: |
          nix eval --raw \
            .#nixosConfigurations.home-server.config.system.build.toplevel.drvPath

      # writeShellApplication runs shellcheck at build time
      - name: Build the backup scripts
        run: |
          nix build --no-link \
            .#nixosConfigurations.home-server.config.system.build.lab-backup-scripts
